<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 420" role="img" aria-labelledby="title desc">
  <title id="title">Logo Oficial JUBAF</title>
  <desc id="desc">Marca oficial da Juventude Batista Feirense com nome JUBAF dentro do peixe e cruz envolvendo o nome</desc>
  <defs>
    <linearGradient id="gNavy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B1B3B"/>
      <stop offset="100%" stop-color="#123A8A"/>
    </linearGradient>
    <linearGradient id="gRoyal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="gGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="fGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g transform="translate(120 70)">
    <!-- Peixe cristao como moldura principal (fundo da composicao) -->
    <path d="M80 96 C 260 -6, 630 -6, 810 96 C 630 198, 260 198, 80 96 Z"
      fill="none" stroke="url(#gRoyal)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M810 96 L 886 50 L 886 142 Z"
      fill="none" stroke="url(#gRoyal)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cruz e chama em primeiro plano, sem conflitar com o texto -->
    <rect x="114" y="26" width="14" height="58" rx="3" fill="url(#gNavy)"/>
    <rect x="95" y="46" width="52" height="10" rx="3" fill="url(#gNavy)"/>
    <path d="M121 0c10 7 17 15 17 25 0 6-3 12-9 18-4-6-10-10-19-12 6-5 8-10 8-15 0-5 1-10 3-16z"
      fill="url(#gGold)" filter="url(#fGlow)"/>

    <!-- Nome central, totalmente legivel -->
    <text x="472" y="136" text-anchor="middle" font-family="Inter, Poppins, Segoe UI, Arial, sans-serif" font-size="116" font-weight="900"
      letter-spacing="5.6" fill="#0B1B3B">JUBAF</text>

    <!-- Assinaturas -->
    <text x="483" y="218" text-anchor="middle" font-family="Inter, Poppins, Segoe UI, Arial, sans-serif" font-size="52" font-weight="800"
      letter-spacing="1.5" fill="#1E40AF">JUVENTUDE BATISTA FEIRENSE</text>
    <text x="483" y="272" text-anchor="middle" font-family="Inter, Poppins, Segoe UI, Arial, sans-serif" font-size="44" font-weight="900"
      letter-spacing="2.5" fill="#D97706">SOMOS UM</text>
  </g>
</svg>
